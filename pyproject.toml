[project]
name = "torch-trace-lab"
version = "0.1.0"
description = "Presentation materials for a SHARCNET General Interest Seminar on PyTorch Profiler and Holistic Trace Analysis, November 18, 2026."
readme = "README.md"
authors = [
    { name = "Collin Wilson", email = "39131920+cwilson51@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "traceinsight>=0.6.1",
    "jupyterlab>=4.6.6",
    "torch>=2.14.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "requests>=2.34.2",
    "triton>=3.6.0 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
presentation = [
    "jupyterlab-rise>=0.43.1",
]
dev = [
    "pytest>=8",
]

[project.scripts]
torch-lab = "torch_trace_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torch_trace_lab = ["templates/*.sh", "hta_llm/prompts/*.md"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
