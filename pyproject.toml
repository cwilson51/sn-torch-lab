[project]
name = "torch-trace-lab"
version = "0.1.0"
description = "Presentation materials for a SHARCNET General Interest Seminar on PyTorch Profiler and Holistic Trace Analysis, November 18, 2026."
readme = "README.md"
authors = [
    { name = "Collin Wilson", email = "39131920+cwilson51@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "holistictraceanalysis>=0.5.0",
    "jupyterlab>=4.6.6",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.optional-dependencies]
presentation = [
    "jupyterlab-rise>=0.43.1",
]

[tool.setuptools.packages.find]
where = ["src"]  

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
